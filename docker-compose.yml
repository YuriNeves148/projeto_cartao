services:
  backend:
    build: ./backend
    container_name: projeto_cartao_backend
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
  mysql:
    image: mysql:8.0
    container_name: projeto_cartao_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: proj_cartao4
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
